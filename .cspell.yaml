version: "0.2"
language: en-US

dictionaries:
  - softwareTerms
  - python
  - bash
  - docker
  - companies
  - fullstack
  - filetypes

# What the 'cspell-unused-words' hook spell checks to find unused words.
files:
  - "**"
  - "**/.*"
  - ".*/**"

useGitignore: true

ignorePaths:
  - .git/**
  - .gitignore
  - LICENSE
  - test/csv/**
  - test/json/**
  - test/pcap/**
  - test/rec/**

patterns:
  # Protocol constants and environment variables (PROT_CMD_JUPMNGR_..., STATEDIR,
  # struct formats such as HHLH) are written in ALL CAPS.
  - name: AllCaps
    pattern: /\b[A-Z][A-Z0-9_]{3,}\b/g
  # Container images, as the names of their users and projects are not ours,
  # for example docker.io/library/influxdb:1.8 or ghcr.io/jbuehl/solaredge.
  - name: ContainerImages
    pattern: /\b(?:[a-z0-9-]+\.)*(?:docker\.io|gcr\.io|ghcr\.io|quay\.io)\/[\w.\/-]+(?::[\w.-]+)?/g

ignoreRegExpList:
  - AllCaps
  - ContainerImages

# Keep every group in alphabetical order; the 'cspell-unused-words' hook fails
# on words that are no longer needed.
