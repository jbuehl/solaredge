name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run: python -m compileall -q .
    - run: test/test.sh
