[project]
name = "semonitor"
requires-python = ">=3.14"

# The dependencies of semonitor itself (`run`), and the tools to test it.
# Installed with `--group NAME`.
[dependency-groups]
run = ["pyserial>=3.5"]
test = [
    { include-group = "run" },
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "python-dateutil",
]

[tool.pytest.ini_options]
addopts = [
    "--durations=10",
    "--durations-min=0.5",
    "--dist=worksteal",
    "--numprocesses=auto",
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

[tool.coverage.run]
branch = true
patch = ["subprocess"]
sigterm = true
source = ["."]
omit = [
    "*/.git/*",
    "*/.venv/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
