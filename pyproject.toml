[project]
name = "semonitor"
requires-python = ">=3.15"

[tool.pytest.ini_options]
addopts = [
    "--durations=10",
    "--durations-min=0.5",
    "--dist=worksteal",
    "--numprocesses=auto",
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["."]
omit = [
    "*/.git/*",
    "*/.venv/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pcap,*.json,*.csv,*.rec,*.msg,*.md,LICENSE"

[tool.ruff]
line-length = 80
extend-exclude = ["test"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps at 80; E501 only flags lines beyond 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# The tests read the pickles that the script they test made itself.
"tests/**" = ["S301"]

[tool.ruff.format]
