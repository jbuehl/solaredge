[project]
name = "semonitor"
requires-python = ">=3.14"

# The dependencies of semonitor itself (`run`), and the tools to develop (`dev`)
# and to test (`test`) it. Installed with `--group NAME`.
[dependency-groups]
dev = ["pre-commit"]
run = ["pyserial>=3.5"]
test = [
    { include-group = "run" },
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "python-dateutil",
]

[tool.pytest.ini_options]
addopts = [
    "--durations=10",
    "--durations-min=0.5",
    "--dist=worksteal",
    "--numprocesses=auto",
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

[tool.coverage.run]
branch = true
patch = ["subprocess"]
sigterm = true
source = ["."]
omit = [
    "*/.git/*",
    "*/.venv/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.csv,*.json,*.md,*.msg,*.pcap,*.rec,LICENSE"
ignore-regex = '\bcancelled\(\)'  # GitHub Actions spells it as `cancelled()`.

[tool.ruff]
line-length = 80
extend-exclude = ["test"]

[tool.ruff.format]
# Always LF, the same as .editorconfig.
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Added to ruff's defaults (E4, E7, E9 and F). Type annotations (ANN) are left
# to mypy.
extend-select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "D213", # multi-line-summary-second-line, off by default in the google convention
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "ERA",  # eradicate
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "T20",  # flake8-print
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D212", # multi-line-summary-first-line, the summary starts on the second line (D213)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pycodestyle]
# The formatter wraps at 80; E501 only flags lines beyond 120.
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D1",      # undocumented-public-*
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
    "S101",    # assert
    "S301",    # suspicious-pickle-usage
    "S603",    # subprocess-without-shell-equals-true
]
